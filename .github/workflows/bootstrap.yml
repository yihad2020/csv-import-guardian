name: Bootstrap source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    if: github.event.head_commit.message == 'Bootstrap CSV Import Guardian source'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          mkdir -p /tmp/csv-import-guardian
          unzip -q bootstrap.zip -d /tmp/csv-import-guardian
          cp -a /tmp/csv-import-guardian/csv-import-guardian/. .
          rm -f bootstrap.zip
          rm -f .github/workflows/bootstrap.yml

      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish CSV Import Guardian source"
          git push
